name: Deploy AWS Dev

on:
  workflow_dispatch:
    inputs:
      deploy_api:
        description: "Confirm a manual API, worker, and migration release after infrastructure is applied"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-southeast-2
  TERRAFORM_VERSION: 1.15.8
  # Prevent Terraform from resolving the local-only hf-dev AWS CLI profile.
  TF_VAR_aws_profile: ""
  ECR_API_REPOSITORY: hms-dev-api
  ECR_CERTIFICATE_ENGINE_REPOSITORY: hms-dev-certificate-engine
  ECS_CLUSTER: ${{ vars.AWS_DEV_ECS_CLUSTER || 'hms-dev' }}
  ECS_API_SERVICE: ${{ vars.AWS_DEV_API_SERVICE || 'hms-dev-api' }}
  ECS_WORKER_SERVICE: ${{ vars.AWS_DEV_WORKER_SERVICE || 'hms-dev-worker' }}
  ECS_BEAT_SERVICE: ${{ vars.AWS_DEV_BEAT_SERVICE || 'hms-dev-beat' }}
  ECS_CERTIFICATE_ENGINE_SERVICE: ${{ vars.AWS_DEV_CERTIFICATE_ENGINE_SERVICE || 'hms-dev-certificate-engine' }}
  ECS_MIGRATE_TASK_DEFINITION: ${{ vars.AWS_DEV_MIGRATE_TASK_DEFINITION || 'hms-dev-migrate' }}
  API_HEALTH_URL: ${{ vars.AWS_DEV_API_HEALTH_URL }}

jobs:
  deploy:
    name: Build and deploy dev
    if: ${{ inputs.deploy_api }}
    runs-on: ubuntu-latest
    environment: aws-dev

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Configure Terraform preflight credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEV_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Verify Terraform infrastructure is already applied
        working-directory: infra/terraform/envs/dev
        run: |
          set -euo pipefail
          plan_log="$(mktemp)"
          cleanup() {
            shred --remove --zero --iterations=1 tfplan "$plan_log" 2>/dev/null \
              || rm -f tfplan "$plan_log"
          }
          trap cleanup EXIT
          terraform init -input=false -lockfile=readonly
          terraform validate
          plan_exit_code=0
          terraform plan -detailed-exitcode -input=false -out=tfplan >"$plan_log" 2>&1 \
            || plan_exit_code=$?
          case "$plan_exit_code" in
            0)
              ;;
            2)
              echo "Terraform changes are pending. Run the reviewed infrastructure workflow before application deployment." >&2
              exit 1
              ;;
            *)
              echo "Terraform preflight failed. Detailed output was suppressed because it may contain sensitive infrastructure data." >&2
              exit "$plan_exit_code"
              ;;
          esac

      - name: Configure application deployment credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEV_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify required task definitions and edge secret injection
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_MIGRATE_TASK_DEFINITION" >/dev/null
          api_task_definition="$(
            aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_API_SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text
          )"
          edge_secret="$(
            aws ecs describe-task-definition \
              --task-definition "$api_task_definition" \
              --query "taskDefinition.containerDefinitions[?name=='api'].secrets[?name=='SECURITY_EDGE_SHARED_SECRET'].valueFrom | [0]" \
              --output text
          )"
          if [ -z "$edge_secret" ] || [ "$edge_secret" = "None" ]; then
            echo "The API task definition does not inject SECURITY_EDGE_SHARED_SECRET. Apply Terraform before release." >&2
            exit 1
          fi

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            --tag "$REGISTRY/$ECR_API_REPOSITORY:latest" \
            --tag "$REGISTRY/$ECR_API_REPOSITORY:${GITHUB_SHA}" \
            backend
          docker push "$REGISTRY/$ECR_API_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_API_REPOSITORY:${GITHUB_SHA}"

      - name: Build and push certificate engine image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build \
            --tag "$REGISTRY/$ECR_CERTIFICATE_ENGINE_REPOSITORY:latest" \
            --tag "$REGISTRY/$ECR_CERTIFICATE_ENGINE_REPOSITORY:${GITHUB_SHA}" \
            services/certificate
          docker push "$REGISTRY/$ECR_CERTIFICATE_ENGINE_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_CERTIFICATE_ENGINE_REPOSITORY:${GITHUB_SHA}"

      - name: Build ECS network configuration
        env:
          AWS_DEV_ECS_SUBNET_IDS: ${{ vars.AWS_DEV_ECS_SUBNET_IDS }}
          AWS_DEV_ECS_SECURITY_GROUP_ID: ${{ vars.AWS_DEV_ECS_SECURITY_GROUP_ID }}
        run: |
          python3 - <<'PY' > ecs-network.json
          import json
          import os

          subnets = [
              subnet.strip()
              for subnet in os.environ["AWS_DEV_ECS_SUBNET_IDS"].split(",")
              if subnet.strip()
          ]
          security_group = os.environ["AWS_DEV_ECS_SECURITY_GROUP_ID"].strip()
          if len(subnets) < 2:
              raise SystemExit("AWS_DEV_ECS_SUBNET_IDS must contain at least two subnet ids")
          if not security_group:
              raise SystemExit("AWS_DEV_ECS_SECURITY_GROUP_ID is required")

          print(json.dumps({
              "awsvpcConfiguration": {
                  "subnets": subnets,
                  "securityGroups": [security_group],
                  "assignPublicIp": "ENABLED",
              }
          }))
          PY

      - name: Validate deployed browser auth configuration
        run: |
          task_arn="$(
            aws ecs run-task \
              --cluster "$ECS_CLUSTER" \
              --launch-type FARGATE \
              --task-definition "$ECS_MIGRATE_TASK_DEFINITION" \
              --network-configuration file://ecs-network.json \
              --overrides '{"containerOverrides":[{"name":"migrate","command":["python","-c","from hms_backend.app.core.config import settings; settings.validate_browser_auth()"]}]}' \
              --query 'tasks[0].taskArn' \
              --output text
          )"
          if [ -z "$task_arn" ] || [ "$task_arn" = "None" ]; then
            echo "Failed to start browser-auth validation task" >&2
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          exit_code="$(
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$task_arn" \
              --query 'tasks[0].containers[0].exitCode' \
              --output text
          )"
          if [ "$exit_code" != "0" ]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn"
            exit "$exit_code"
          fi

      - name: Run database migrations and dev seed
        run: |
          task_arn="$(
            aws ecs run-task \
              --cluster "$ECS_CLUSTER" \
              --launch-type FARGATE \
              --task-definition "$ECS_MIGRATE_TASK_DEFINITION" \
              --network-configuration file://ecs-network.json \
              --query 'tasks[0].taskArn' \
              --output text
          )"
          if [ -z "$task_arn" ] || [ "$task_arn" = "None" ]; then
            echo "Failed to start migration task" >&2
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task_arn"
          exit_code="$(
            aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" \
              --tasks "$task_arn" \
              --query 'tasks[0].containers[0].exitCode' \
              --output text
          )"
          if [ "$exit_code" != "0" ]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task_arn"
            exit "$exit_code"
          fi

      - name: Force ECS service deployments
        run: |
          active_services=()
          for service in \
            "$ECS_CERTIFICATE_ENGINE_SERVICE" \
            "$ECS_API_SERVICE" \
            "$ECS_WORKER_SERVICE" \
            "$ECS_BEAT_SERVICE"; do
            desired_count="$(
              aws ecs describe-services \
                --cluster "$ECS_CLUSTER" \
                --services "$service" \
                --query 'services[0].desiredCount' \
                --output text
            )"
            if [ "$desired_count" = "None" ] || [ -z "$desired_count" ]; then
              echo "ECS service $service was not found" >&2
              exit 1
            fi
            if [ "$desired_count" -eq 0 ]; then
              echo "Skipping $service because its desired count is zero"
              continue
            fi
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" \
              --service "$service" \
              --force-new-deployment >/dev/null
            active_services+=("$service")
          done
          if [ "${#active_services[@]}" -gt 0 ]; then
            if ! aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "${active_services[@]}"; then
              echo "ECS services did not stabilize; collecting diagnostics" >&2
              aws ecs describe-services \
                --cluster "$ECS_CLUSTER" \
                --services "${active_services[@]}"
              for service in "${active_services[@]}"; do
                if ! task_arn_output="$(
                  aws ecs list-tasks \
                    --cluster "$ECS_CLUSTER" \
                    --service-name "$service" \
                    --desired-status STOPPED \
                    --query 'taskArns[:5]' \
                    --output text
                )"; then
                  echo "Stopped-task diagnostics are unavailable to the deploy role" >&2
                  continue
                fi
                if [ -n "$task_arn_output" ] && [ "$task_arn_output" != "None" ]; then
                  read -r -a task_arns <<< "$task_arn_output"
                  aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "${task_arns[@]}"
                fi
              done
              exit 1
            fi
          fi

      - name: Verify API health through the configured public endpoint
        run: |
          if [ -z "$API_HEALTH_URL" ]; then
            echo "AWS_DEV_API_HEALTH_URL is required for application deployment." >&2
            exit 1
          fi
          curl --fail --show-error --silent --retry 5 --retry-all-errors \
            "$API_HEALTH_URL"
