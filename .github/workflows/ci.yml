name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hms
          POSTGRES_PASSWORD: hms
          POSTGRES_DB: hms_inspector_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms -d hms_inspector_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --dev
      - run: uv run ruff check . ../tooling
      - run: uv run mypy src tests ../tooling
      - run: uv run pytest
      - name: Migrate PostgreSQL race-test database
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://hms:hms@127.0.0.1:5432/hms_inspector_test
      - name: Test inspector, certificate, identity, audit, sync and notification persistence on PostgreSQL
        run: >-
          uv run pytest tests/test_inspector_postgres_races.py
          tests/test_certificate_postgres_races.py
          tests/test_persisted_user_ids_postgres.py
          tests/test_customer_access_postgres.py
          tests/test_audit_redaction_postgres.py
          tests/test_audit_chain_postgres.py
          tests/test_certificate_durability_postgres.py
          tests/test_sync_correctness_postgres.py
          tests/test_notification_claims_postgres.py
          tests/test_delivery_receipts_postgres.py
          tests/test_retest_scheduler_postgres.py
          tests/test_notification_readiness_postgres.py
          tests/test_rc_product_flow_postgres.py
          tests/test_sync_bootstrap_paging.py -v
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://hms:hms@127.0.0.1:5432/hms_inspector_test

  workflow-scripts:
    # Guards the release controls (Terraform plan verification/review, deploy
    # workflow invariants) that otherwise have no automated coverage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py" -v

  certificate-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/certificate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest

  staff-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/apps/staff
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/apps/staff/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  inspector-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/apps/inspector
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/apps/inspector/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - run: docker compose config --quiet
      - run: docker compose --profile frontend build

  staff-auth-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/apps/staff/package-lock.json
      - run: npm ci
        working-directory: web/apps/staff
      - run: npx playwright install --with-deps chromium
        working-directory: web/apps/staff
      - run: AUTH_MFA_REQUIRED=true AUTH_LOGIN_ACCOUNT_RATE_LIMIT_MAX_ATTEMPTS=100 AUTH_LOGIN_IP_RATE_LIMIT_MAX_ATTEMPTS=100 docker compose --profile frontend up -d --build
      - run: curl --fail --retry 30 --retry-delay 2 http://127.0.0.1:8000/health/ready
      - run: npm run test:e2e
        working-directory: web/apps/staff
      - if: failure()
        run: docker compose logs --no-color api migrate staff
      - if: always()
        run: docker compose --profile frontend down -v
