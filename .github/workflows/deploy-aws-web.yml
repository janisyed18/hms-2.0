name: Deploy AWS Web

on:
  workflow_dispatch:
    inputs:
      deploy_staff_portal:
        description: "Confirm a manual staff and customer portal web release"
        required: true
        default: false
        type: boolean
      deploy_inspector:
        description: "Confirm a manual inspector web release"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-dev-web
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2

jobs:
  deploy:
    name: Build and deploy web applications
    if: ${{ inputs.deploy_staff_portal || inputs.deploy_inspector }}
    runs-on: ubuntu-latest
    environment: aws-dev

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Enforce web release gates
        env:
          STAFF_BUCKET: ${{ vars.AWS_DEV_STAFF_BUCKET }}
          STAFF_DISTRIBUTION_ID: ${{ vars.AWS_DEV_STAFF_DISTRIBUTION_ID }}
          INSPECTOR_BUCKET: ${{ vars.AWS_DEV_INSPECTOR_BUCKET }}
          INSPECTOR_DISTRIBUTION_ID: ${{ vars.AWS_DEV_INSPECTOR_DISTRIBUTION_ID }}
          API_HEALTH_URL: ${{ vars.AWS_DEV_API_HEALTH_URL }}
        run: |
          set -euo pipefail

          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "AWS dev web releases must run from main." >&2
            exit 1
          }

          if [ "${{ inputs.deploy_inspector }}" = "true" ]; then
            test -n "$INSPECTOR_BUCKET" || {
              echo "AWS_DEV_INSPECTOR_BUCKET is required." >&2
              exit 1
            }
            case "$INSPECTOR_BUCKET" in
              hms-dev-inspector-*) ;;
              *)
                echo "AWS_DEV_INSPECTOR_BUCKET is not an HMS dev inspector bucket." >&2
                exit 1
                ;;
            esac

            test -n "$INSPECTOR_DISTRIBUTION_ID" || {
              echo "AWS_DEV_INSPECTOR_DISTRIBUTION_ID is required." >&2
              exit 1
            }
          fi

          if [ "${{ inputs.deploy_staff_portal }}" = "true" ]; then
            test -n "$STAFF_BUCKET" || {
              echo "AWS_DEV_STAFF_BUCKET is required." >&2
              exit 1
            }
            case "$STAFF_BUCKET" in
              hms-dev-staff-*) ;;
              *)
                echo "AWS_DEV_STAFF_BUCKET is not an HMS dev staff bucket." >&2
                exit 1
                ;;
            esac

            test -n "$STAFF_DISTRIBUTION_ID" || {
              echo "AWS_DEV_STAFF_DISTRIBUTION_ID is required." >&2
              exit 1
            }
            test -n "$API_HEALTH_URL" || {
              echo "AWS_DEV_API_HEALTH_URL is required for post-deploy verification." >&2
              exit 1
            }
          fi

      - name: Configure AWS credentials
        if: ${{ inputs.deploy_staff_portal || inputs.deploy_inspector }}
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEV_GITHUB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ inputs.deploy_staff_portal || inputs.deploy_inspector }}
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            web/apps/staff/package-lock.json
            web/apps/inspector/package-lock.json

      - name: Build staff and customer portal apps
        if: ${{ inputs.deploy_staff_portal }}
        working-directory: web/apps/staff
        run: |
          set -euo pipefail
          npm ci
          npm test -- --run
          npm run build
          npm run build:portal

      - name: Upload staff app
        if: ${{ inputs.deploy_staff_portal }}
        env:
          STAFF_BUCKET: ${{ vars.AWS_DEV_STAFF_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 sync web/apps/staff/dist "s3://$STAFF_BUCKET" \
            --delete \
            --exclude "index.html" \
            --exclude "portal/*" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/apps/staff/dist/index.html "s3://$STAFF_BUCKET/index.html" \
            --cache-control "no-cache"

      - name: Upload customer portal
        if: ${{ inputs.deploy_staff_portal }}
        env:
          STAFF_BUCKET: ${{ vars.AWS_DEV_STAFF_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 sync web/apps/staff/dist-portal "s3://$STAFF_BUCKET/portal" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/apps/staff/dist-portal/portal.html "s3://$STAFF_BUCKET/portal/index.html" \
            --cache-control "no-cache"

      - name: Build inspector app
        if: ${{ inputs.deploy_inspector }}
        working-directory: web/apps/inspector
        run: |
          set -euo pipefail
          npm ci
          npm test -- --run
          npm audit --omit=dev
          npm run build

      - name: Upload inspector app
        if: ${{ inputs.deploy_inspector }}
        env:
          INSPECTOR_BUCKET: ${{ vars.AWS_DEV_INSPECTOR_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 sync web/apps/inspector/dist "s3://$INSPECTOR_BUCKET" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/apps/inspector/dist/index.html "s3://$INSPECTOR_BUCKET/index.html" \
            --cache-control "no-cache"

      - name: Invalidate staff CloudFront distribution
        if: ${{ inputs.deploy_staff_portal }}
        env:
          STAFF_DISTRIBUTION_ID: ${{ vars.AWS_DEV_STAFF_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$STAFF_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Invalidate inspector CloudFront distribution
        if: ${{ inputs.deploy_inspector }}
        env:
          INSPECTOR_DISTRIBUTION_ID: ${{ vars.AWS_DEV_INSPECTOR_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "$INSPECTOR_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Verify public staff, portal, and API endpoints
        if: ${{ inputs.deploy_staff_portal }}
        env:
          API_HEALTH_URL: ${{ vars.AWS_DEV_API_HEALTH_URL }}
        run: |
          set -euo pipefail
          case "$API_HEALTH_URL" in
            */health) STAFF_BASE_URL="${API_HEALTH_URL%/health}" ;;
            *)
              echo "AWS_DEV_API_HEALTH_URL must end in /health." >&2
              exit 1
              ;;
          esac

          curl --fail --silent --show-error --retry 12 --retry-delay 5 "$STAFF_BASE_URL/" >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "$STAFF_BASE_URL/portal/" >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "$API_HEALTH_URL" >/dev/null
          echo "Verified staff app, customer portal, and API health endpoints."

      - name: Verify public inspector and browser-auth edge behavior
        if: ${{ inputs.deploy_inspector }}
        env:
          INSPECTOR_DISTRIBUTION_ID: ${{ vars.AWS_DEV_INSPECTOR_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail

          INSPECTOR_DOMAIN="$(
            aws cloudfront get-distribution \
              --id "$INSPECTOR_DISTRIBUTION_ID" \
              --query 'Distribution.DomainName' \
              --output text
          )"
          test -n "$INSPECTOR_DOMAIN" || {
            echo "Inspector CloudFront distribution did not return a domain name." >&2
            exit 1
          }
          INSPECTOR_BASE_URL="https://${INSPECTOR_DOMAIN}"

          curl --fail --silent --show-error --retry 12 --retry-delay 5 "$INSPECTOR_BASE_URL/" >/dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 "$INSPECTOR_BASE_URL/health" >/dev/null

          assert_response() {
            local name="$1"
            local expected_status="$2"
            local expected_message="$3"
            shift 3

            local response status curl_exit
            response="$(mktemp)"

            for _ in {1..12}; do
              set +e
              status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' "$@")"
              curl_exit=$?
              set -e
              if [ "$curl_exit" -eq 0 ] && [ "$status" = "$expected_status" ] && grep -Fq "$expected_message" "$response"; then
                rm -f "$response"
                return 0
              fi
              sleep 5
            done

            echo "$name failed: expected HTTP $expected_status containing '$expected_message', got HTTP $status." >&2
            rm -f "$response"
            return 1
          }

          assert_response \
            "Allowed inspector origin refresh" \
            401 \
            "No session" \
            --request POST \
            --header "Origin: $INSPECTOR_BASE_URL" \
            "$INSPECTOR_BASE_URL/api/v1/auth/browser/refresh"
          assert_response \
            "Disallowed inspector origin refresh" \
            403 \
            "Origin not allowed" \
            --request POST \
            --header "Origin: https://example.invalid" \
            "$INSPECTOR_BASE_URL/api/v1/auth/browser/refresh"
          assert_response \
            "Invalid inspector bearer" \
            401 \
            "Invalid bearer token" \
            --header "Authorization: Bearer deliberately-invalid" \
            "$INSPECTOR_BASE_URL/api/v1/auth/browser/me"

          echo "Verified inspector app, health, refresh-origin, and bearer-auth edge checks."
