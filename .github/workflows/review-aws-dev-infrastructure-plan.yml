name: Review AWS Dev Infrastructure Plan

# Review-only: decrypts the exact binary plan that Apply would consume and
# publishes a sanitized STRUCTURAL report (resource addresses, actions, changed
# attribute names, counts). It never applies, holds no AWS credentials, and never
# prints a plan value. Use it to review a Plan run before authorising Apply.

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: "Successful Plan AWS Dev Infrastructure workflow run ID to review"
        required: true
        type: string

# No OIDC token is requested: this job cannot obtain AWS credentials.
permissions:
  actions: read
  contents: read

concurrency:
  group: aws-dev-infrastructure-review
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.15.8
  # Providers are installed for schema loading only; nothing here talks to AWS.
  TF_VAR_aws_profile: ""

jobs:
  review:
    name: Review reviewed infrastructure plan
    runs-on: ubuntu-latest
    # Holds the plan decryption key, so it uses the same protected environment as
    # Apply. DEV runs under the single-maintainer exception documented in
    # docs/aws/dev-deployment.md (no independent environment reviewer); staging and
    # production must require an independent reviewer and prevent self-review.
    environment: aws-dev

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7
        with:
          ref: main
          fetch-depth: 1

      - name: Require main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Plan review must run from main." >&2
            exit 1
          }

      - name: Verify reviewed plan source
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID" \
            > "$RUNNER_TEMP/plan-run.json"
          python3 .github/scripts/verify-terraform-plan-run.py \
            --run-json "$RUNNER_TEMP/plan-run.json" \
            --commit-sha "$(git rev-parse HEAD)"

      - name: Download reviewed Terraform plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aws-dev-terraform-plan-${{ inputs.plan_run_id }}
          path: infra/terraform/envs/dev
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}
          digest-mismatch: error

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install verified plan decryption tool
        run: bash .github/scripts/install-age.sh

      - name: Verify reviewed plan integrity
        working-directory: infra/terraform/envs/dev
        run: |
          sha256sum --check tfplan.age.sha256
          sha256sum --check tfplan.txt.age.sha256
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-terraform-plan-artifact.py" \
            --directory . \
            --plan-run-id "${{ inputs.plan_run_id }}" \
            --commit-sha "$(git rev-parse HEAD)" \
            --terraform-version "$(terraform version -json | python3 -c 'import json, sys; print(json.load(sys.stdin)["terraform_version"])')"
          # -backend=false: the plan carries its own state snapshot, and this job
          # has no AWS credentials to reach the remote backend anyway.
          terraform init -backend=false -input=false -lockfile=readonly

      - name: Decrypt the reviewed plan
        working-directory: infra/terraform/envs/dev
        env:
          TERRAFORM_PLAN_AGE_PRIVATE_KEY: ${{ secrets.AWS_DEV_TERRAFORM_PLAN_AGE_PRIVATE_KEY }}
        run: |
          test -n "$TERRAFORM_PLAN_AGE_PRIVATE_KEY" || {
            echo "AWS_DEV_TERRAFORM_PLAN_AGE_PRIVATE_KEY is required." >&2
            exit 1
          }
          umask 077
          key_file="$(mktemp)"
          cleanup() {
            status=$?
            shred --remove --zero --iterations=1 "$key_file" 2>/dev/null || rm -f "$key_file"
            if [ "$status" -ne 0 ]; then
              shred --remove --zero --iterations=1 tfplan 2>/dev/null || rm -f tfplan
            fi
            exit "$status"
          }
          trap cleanup EXIT
          printf '%s' "$TERRAFORM_PLAN_AGE_PRIVATE_KEY" | \
            python3 "$GITHUB_WORKSPACE/.github/scripts/decode-age-identity.py" --output "$key_file"
          age --decrypt --identity "$key_file" --output tfplan tfplan.age
          test -s tfplan

      # The key is gone and no secret is in this step's environment. Plan JSON goes
      # to a file, never to the log; only the sanitized report is published.
      - name: Publish sanitized structural report
        working-directory: infra/terraform/envs/dev
        env:
          TF_IN_AUTOMATION: "true"
        run: |
          set +x
          report="$(mktemp)"
          cleanup() {
            shred --remove --zero --iterations=1 tfplan plan.json "$report" 2>/dev/null \
              || rm -f tfplan plan.json "$report"
          }
          trap cleanup EXIT
          terraform show -json tfplan > plan.json 2>/dev/null
          python3 "$GITHUB_WORKSPACE/.github/scripts/summarize-terraform-plan.py" \
            --plan-json plan.json \
            --manifest plan-manifest.json > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
