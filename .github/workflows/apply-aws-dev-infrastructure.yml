name: Apply AWS Dev Infrastructure

on:
  workflow_dispatch:
    inputs:
      apply_infrastructure:
        description: "Confirm that the reviewed Terraform plan may be applied to aws-dev"
        required: true
        default: false
        type: boolean
      plan_run_id:
        description: "Successful Plan AWS Dev Infrastructure workflow run ID to apply"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: aws-dev-infrastructure
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  TERRAFORM_VERSION: 1.15.8
  TERRAFORM_ROLE_ARN: ${{ vars.AWS_DEV_TERRAFORM_ROLE_ARN }}
  DEPLOY_ROLE_ARN: ${{ vars.AWS_DEV_GITHUB_ROLE_ARN }}
  # Terraform defaults to the hf-dev CLI profile for local commands. GitHub
  # Actions must instead use the short-lived OIDC credentials configured below.
  TF_VAR_aws_profile: ""

jobs:
  apply:
    name: Apply reviewed infrastructure plan
    if: ${{ inputs.apply_infrastructure }}
    runs-on: ubuntu-latest
    # DEV runs under the single-maintainer exception documented in
    # docs/aws/dev-deployment.md: there is no independent Environment reviewer.
    # Before an operator dispatches Apply, the DEV release process requires the
    # exact plan to be technically reviewed with Review AWS Dev Infrastructure Plan
    # and an explicit Apply decision. Apply does not independently verify a Review
    # run. Staging and production must require an independent reviewer, prevent
    # self-review and disable administrator bypass.
    environment: aws-dev

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.1.7
        with:
          ref: main
          fetch-depth: 1

      - name: Require dedicated Terraform role
        run: |
          test -n "$TERRAFORM_ROLE_ARN" || {
            echo "AWS_DEV_TERRAFORM_ROLE_ARN is required." >&2
            exit 1
          }
          test "$TERRAFORM_ROLE_ARN" != "$DEPLOY_ROLE_ARN" || {
            echo "Terraform must not use the application deployment role." >&2
            exit 1
          }

      - name: Verify reviewed plan source
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN_ID" \
            > /tmp/plan-run.json
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          run = json.load(open("/tmp/plan-run.json", encoding="utf-8"))
          expected_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          expected = {
              "name": "Plan AWS Dev Infrastructure",
              "event": "workflow_dispatch",
              "status": "completed",
              "conclusion": "success",
              "head_branch": "main",
              "head_sha": expected_sha,
          }
          mismatches = {
              key: {"expected": value, "actual": run.get(key)}
              for key, value in expected.items()
              if run.get(key) != value
          }
          if mismatches:
              print(json.dumps(mismatches, indent=2), file=sys.stderr)
              raise SystemExit(
                  "The supplied plan run is not a successful plan for the current main commit."
              )
          print(f"Verified plan run {os.environ['PLAN_RUN_ID']} for {expected_sha}.")
          PY

      - name: Download reviewed Terraform plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aws-dev-terraform-plan-${{ inputs.plan_run_id }}
          path: infra/terraform/envs/dev
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.plan_run_id }}
          digest-mismatch: error

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ env.TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Install verified plan decryption tool
        run: bash .github/scripts/install-age.sh

      - name: Verify reviewed plan integrity
        working-directory: infra/terraform/envs/dev
        run: |
          sha256sum --check tfplan.age.sha256
          sha256sum --check tfplan.txt.age.sha256
          python3 "$GITHUB_WORKSPACE/.github/scripts/verify-terraform-plan-artifact.py" \
            --directory . \
            --plan-run-id "${{ inputs.plan_run_id }}" \
            --commit-sha "$(git rev-parse HEAD)" \
            --terraform-version "$(terraform version -json | python3 -c 'import json, sys; print(json.load(sys.stdin)["terraform_version"])')"
          terraform init -input=false -lockfile=readonly
          terraform validate

      - name: Decrypt reviewed infrastructure plan
        working-directory: infra/terraform/envs/dev
        env:
          TERRAFORM_PLAN_AGE_PRIVATE_KEY: ${{ secrets.AWS_DEV_TERRAFORM_PLAN_AGE_PRIVATE_KEY }}
        run: |
          test -n "$TERRAFORM_PLAN_AGE_PRIVATE_KEY" || {
            echo "AWS_DEV_TERRAFORM_PLAN_AGE_PRIVATE_KEY is required." >&2
            exit 1
          }
          umask 077
          key_file="$(mktemp)"
          cleanup() {
            status=$?
            shred --remove --zero --iterations=1 "$key_file" 2>/dev/null || rm -f "$key_file"
            if [ "$status" -ne 0 ]; then
              shred --remove --zero --iterations=1 tfplan 2>/dev/null || rm -f tfplan
            fi
            exit "$status"
          }
          trap cleanup EXIT
          printf '%s' "$TERRAFORM_PLAN_AGE_PRIVATE_KEY" | \
            python3 "$GITHUB_WORKSPACE/.github/scripts/decode-age-identity.py" --output "$key_file"
          age --decrypt --identity "$key_file" --output tfplan tfplan.age
          test -s tfplan

      - name: Apply reviewed infrastructure plan
        working-directory: infra/terraform/envs/dev
        run: |
          trap 'shred --remove --zero --iterations=1 tfplan 2>/dev/null || rm -f tfplan' EXIT
          terraform apply -input=false -auto-approve tfplan
